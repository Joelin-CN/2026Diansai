# Try software reset approach for MSPM0G3507
adapter speed 50

source [find interface/cmsis-dap.cfg]
transport select swd

set DAP_SWD_ID 0x6ba02477
set CHIPNAME mspm0g

# Create DAP
swd newdap $CHIPNAME cpu -expected-id $DAP_SWD_ID
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu

# Try to access Power AP before creating target
# This might help wake up the debug interface
proc wake_debug {} {
    catch {mspm0g.dap apreg 4 0x00 0x104008}
    catch {mspm0g.dap apreg 4 0xF0 0x01}
    catch {mspm0g.dap apreg 4 0x00 0x100008}
    sleep 100
}

# Create target
set _TARGETNAME $CHIPNAME.cpu
target create $_TARGETNAME cortex_m -dap $CHIPNAME.dap

# Try wake procedure during examine
$_TARGETNAME configure -event examine-start {wake_debug}

# Use system reset request instead of hardware reset
cortex_m reset_config sysresetreq

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x400 -work-area-backup 0

# Flash banks
flash bank $CHIPNAME.flash.main mspm0 0 0 0 0 $_TARGETNAME
flash bank $CHIPNAME.flash.nonmain mspm0 0x41c00000 0 0 0 $_TARGETNAME
flash bank $CHIPNAME.flash.data mspm0 0x41d00000 0 0 0 $_TARGETNAME
