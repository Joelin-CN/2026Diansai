# Manual unlock and debug enable for MSPM0G3507
adapter speed 50

source [find interface/cmsis-dap.cfg]
transport select swd

set DAP_SWD_ID 0x6ba02477
set CHIPNAME mspm0g

swd newdap $CHIPNAME cpu -expected-id $DAP_SWD_ID
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu

init

echo "========================================="
echo "Step 1: Reading AP configuration..."
echo "========================================="

echo "AP 0 IDR (MEM-AP):"
catch {$CHIPNAME.dap apreg 0 0xFC}

echo "AP 1 IDR:"
catch {$CHIPNAME.dap apreg 1 0xFC}

echo "AP 2 IDR (SECAP):"
catch {$CHIPNAME.dap apreg 2 0xFC}

echo "AP 4 IDR (PWR-AP):"
catch {$CHIPNAME.dap apreg 4 0xFC}

echo "\n========================================="
echo "Step 2: Configuring Power AP..."
echo "========================================="

# Configure Power AP to enable debug access
echo "Writing PWR_AP::DPREC (force active, reset control)..."
$CHIPNAME.dap apreg 4 0x00 0x104008

echo "Writing PWR_AP::SPREC (system reset)..."
$CHIPNAME.dap apreg 4 0xF0 0x01

sleep 200

echo "Writing PWR_AP::DPREC (force active, inhibit sleep)..."
$CHIPNAME.dap apreg 4 0x00 0x100008

sleep 200

echo "\n========================================="
echo "Step 3: Re-checking MEM-AP..."
echo "========================================="

echo "AP 0 IDR after power config:"
catch {$CHIPNAME.dap apreg 0 0xFC}

echo "AP 0 BASE (base address):"
catch {$CHIPNAME.dap apreg 0 0xF8}

echo "\n========================================="
echo "Step 4: Creating target..."
echo "========================================="

target create $CHIPNAME.cpu cortex_m -dap $CHIPNAME.dap

echo "\nDone. Check if target was created successfully."

exit
