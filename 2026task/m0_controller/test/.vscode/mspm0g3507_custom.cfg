# Custom configuration for MSPM0G3507
adapter speed 4000

source [find interface/cmsis-dap.cfg]

transport select swd

# MSPM0G3507 specific ID
set DAP_SWD_ID 0x6ba02477

# Manual DAP configuration
swd newdap mspm0g cpu -expected-id $DAP_SWD_ID
dap create mspm0g.dap -chain-position mspm0g.cpu

# Create target with explicit MEM-AP (usually AP 0)
set _TARGETNAME mspm0g.cpu
target create $_TARGETNAME cortex_m -dap mspm0g.dap -ap-num 0

# Access Power AP to enable debug in low power mode during examine
$_TARGETNAME configure -event examine-start {
    # PWR_AP::DPREC <= FRCACT(3)=1, RST_CTL(14:16)=1, IHIB_SLP(20)=1
    mspm0g.dap apreg 4 0x00 0x104008
    # PWR_AP::SPREC <= SYSRST=1
    mspm0g.dap apreg 4 0xF0 0x01
    # PWR_AP::DPREC <= FRCACT(3)=1, IHIB_SLP(20)=1
    mspm0g.dap apreg 4 0x00 0x100008
}

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x400 -work-area-backup 0

# Flash banks
flash bank mspm0g.flash.main mspm0 0 0 0 0 $_TARGETNAME
flash bank mspm0g.flash.nonmain mspm0 0x41c00000 0 0 0 $_TARGETNAME
flash bank mspm0g.flash.data mspm0 0x41d00000 0 0 0 $_TARGETNAME

cortex_m reset_config sysresetreq
