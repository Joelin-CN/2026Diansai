# MSPM0G3507 configuration with reset handling
adapter speed 4000

source [find interface/cmsis-dap.cfg]

transport select swd

# MSPM0G3507 specific ID
set DAP_SWD_ID 0x6ba02477

# Enable CMSIS-DAP reset if available
# Note: This only works if RST is connected to the debugger
adapter srst delay 100
adapter srst pulse_width 100

source [find target/ti/mspm0.cfg]
