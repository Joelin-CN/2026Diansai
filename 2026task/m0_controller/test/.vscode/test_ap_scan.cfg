# Test script to scan and diagnose AP access
adapter speed 100

source [find interface/cmsis-dap.cfg]
transport select swd

# MSPM0G3507 specific ID
set CHIPNAME mspm0g
set DAP_SWD_ID 0x6ba02477

swd newdap $CHIPNAME cpu -expected-id $DAP_SWD_ID
dap create $CHIPNAME.dap -chain-position $CHIPNAME.cpu

init

echo "========================================="
echo "Scanning Access Ports (AP)..."
echo "========================================="

# Try to read AP IDR registers (0xFC) for AP 0-7
echo "\nAP 0 IDR:"
catch {$CHIPNAME.dap apreg 0 0xFC}
echo "\nAP 1 IDR:"
catch {$CHIPNAME.dap apreg 1 0xFC}
echo "\nAP 2 IDR:"
catch {$CHIPNAME.dap apreg 2 0xFC}
echo "\nAP 3 IDR:"
catch {$CHIPNAME.dap apreg 3 0xFC}
echo "\nAP 4 IDR:"
catch {$CHIPNAME.dap apreg 4 0xFC}

echo "\n========================================="
echo "Trying Power AP configuration..."
echo "========================================="

# Try to configure Power AP (AP 4)
echo "\nWriting to PWR_AP::DPREC (0x00):"
catch {$CHIPNAME.dap apreg 4 0x00 0x104008}
echo "Writing to PWR_AP::SPREC (0xF0):"
catch {$CHIPNAME.dap apreg 4 0xF0 0x01}
echo "Writing to PWR_AP::DPREC (0x00) again:"
catch {$CHIPNAME.dap apreg 4 0x00 0x100008}

echo "\n========================================="
echo "Re-scanning after power configuration..."
echo "========================================="

echo "\nAP 0 IDR:"
catch {$CHIPNAME.dap apreg 0 0xFC}
echo "\nAP 1 IDR:"
catch {$CHIPNAME.dap apreg 1 0xFC}

exit
